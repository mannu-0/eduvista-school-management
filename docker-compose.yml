services:

  mongodb:
    image: mongo:8
    container_name: eduvista-mongodb
    restart: unless-stopped
    volumes:
      - eduvista_mongodb_data:/data/db
    networks:
      - eduvista-network

  backend:
    build:
      context: ./backend
    image: eduvista-backend:1.0
    container_name: eduvista-backend
    restart: unless-stopped
    environment:
      PORT: 5001
      MONGO_URI: mongodb://mongodb:27017/eduvista
      JWT_SECRET: eduvista_admin_secret_change_this
    ports:
      - "5001:5001"
    depends_on:
      - mongodb
    networks:
      - eduvista-network

  frontend:
    build:
      context: ./frontend
    image: eduvista-frontend:1.0
    container_name: eduvista-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - eduvista-network

volumes:
  eduvista_mongodb_data:

networks:
  eduvista-network:
    driver: bridge
