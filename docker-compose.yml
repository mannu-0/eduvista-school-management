name: eduvista

services:

  mongodb:
    image: mongo:8
    container_name: eduvista-mongodb
    restart: unless-stopped

    volumes:
      - eduvista_mongodb_data:/data/db

    networks:
      - eduvista-network

    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s


  backend:
    image: mannu0/eduvista-backend:latest
    container_name: eduvista-backend
    restart: unless-stopped

    environment:
      PORT: 5001
      MONGO_URI: mongodb://mongodb:27017/eduvista
      JWT_SECRET: eduvista_admin_secret_change_this

    ports:
      - "5001:5001"

    depends_on:
      mongodb:
        condition: service_healthy

    networks:
      - eduvista-network

    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5001/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s


  frontend:
    image: mannu0/eduvista-frontend:latest
    container_name: eduvista-frontend
    restart: unless-stopped

    ports:
      - "8080:80"

    depends_on:
      backend:
        condition: service_healthy

    networks:
      - eduvista-network


volumes:
  eduvista_mongodb_data:


networks:
  eduvista-network:
    driver: bridge
